# The league being drafted for. Confirmed against the Sleeper API on 2026-08-30
# with `python -m scripts.verify_league_settings 1389723592727461888`: all nine
# checked settings match, including the roster shape that used to be assumed.
current:
  season: 2026
  name: "Camden?"
  league_id: "1389723592727461888"
  draft_id: "1389723592727461889"
  previous_league_id: "1262443299793276928"
  draft_type: snake
  rounds: 16
  # Announced by the commissioner out of band on 2026-09-02, ahead of Sleeper:
  # the draft order is set and we are at slot 10 (last in a 10-team snake, so
  # back-to-back picks at 10/11, 30/31, ... and an 18-pick wait between turns).
  #
  # Sleeper's `draft_order` is still null, so `monitor.run`'s cross-check
  # (which refuses a slot Sleeper disagrees with) cannot fire yet and this
  # number is UNVERIFIED. It becomes verified for free the moment the
  # commissioner saves the order — the monitor will raise on a mismatch.
  #
  # `--my-slot` defaults to this, so draft day does not depend on typing it.
  my_slot: 10

verified:
  # Promoted from `assumed_2026` once the 2026 league existed and agreed.
  teams: 10
  bench_slots: 7
  roster_size: 16
  scoring_format: ppr
  waiver_type: 0            # 0 = rolling waiver order. NOT FAAB.
  waiver_type_name: rolling_priority
  faab_enabled: false       # waiver_budget=100 appears in payload but is inert
  playoff_week_start: 15
  playoff_weeks: [15, 16, 17]
  playoff_teams: 6
  playoff_byes: 2           # top 2 seeds
  trade_deadline_week: 11
  starters: [QB, RB, RB, WR, WR, TE, FLEX, K, DEF]
  flex_eligible: [RB, WR, TE]

backtest:
  # 2020 start: modern rules + complete FantasyPros ADP coverage.
  seasons: [2020, 2021, 2022, 2023, 2024, 2025]
  purge_gap_seasons: 1
  seed: 20260830

  # Keep only the most recent N training seasons (rolling window) instead of
  # every season up to the purge gap (expanding). Null = expanding.
  #
  # Under test: the board's rank-correlation edge over ADP decays across folds
  # (+0.096 in 2022, +0.034 in 2023, -0.019 in 2024, -0.033 in 2025) while the
  # training window grows, which is what you would see if old seasons transfer
  # badly and drag the rank curve toward a game nobody is playing any more.
  max_train_seasons: 3
  # Season downweighting is off. The 2024 K/DEF downweight (kickoff-rule
  # anomaly) was removed by the manager's call rather than tested; K and DEF are
  # market-anchored now, so their curve barely reaches the board anyway.
  # `fit_rank_curve` accepts a list of {season, positions, weight} here if a
  # future season needs discounting.
  downweight: []

  # Which field the simulated drafter faces.
  #
  #   gaussian — each opponent pick sampled around ADP rank with gaussian noise
  #              and a multiplicative positional-need factor. Every recorded
  #              number in HANDOFF.md and in tests/fixtures/backtest_baseline.json
  #              was produced under this, which is why it is still the default.
  #   league   — fitted to this league's own drafts (2021 + 2025 under
  #              data/league_history/) by src/backtest/opponent_fit.py. See
  #              `python -m scripts.fit_opponent_model` for the measurement, and
  #              HANDOFF.md "The opponent model" for what changing it costs.
  #
  # Swap with `--opponent league` on run_backtest or check_backtest_baseline
  # rather than editing this, unless you are changing what ships.
  opponent_model:
    model: gaussian

    # --- gaussian only -------------------------------------------------
    # Sigma priors for the gaussian field. Note the docstring these used to
    # carry claimed they were "calibrated by scripts/calibrate_adp_sigma.py";
    # that script has never existed in this repo. They are priors, and the
    # league's own drafts say every one of them is too tight — measured sd of
    # (pick_no - adp_rank) is RB 11.9, WR 15.4, DEF 19.3, TE 23.1, K 35.2,
    # QB 47.3.
    adp_sigma_fallback:
      QB: 12.0
      RB: 10.0
      WR: 8.0
      TE: 11.0
      K: 6.0
      DEF: 6.0
    positional_need_boost: 1.6   # multiplier when a starting slot is unfilled
    positional_need_penalty: 0.4 # multiplier when the position is already full

    # --- league only ---------------------------------------------------
    # Which of this league's drafts a fold may fit its field on.
    #   prior — only drafts held strictly before the fold's target season.
    #   all   — every draft, for the offline report where there is no fold.
    fit_scope: prior
    # Rounds added to a position's key once a roster already holds as many of
    # it as a team in this league actually ends up holding. The run curve sets
    # *when* a position goes; this stops one simulated manager taking three
    # kickers in round 13 because kickers are cheap there.
    over_ceiling_penalty: 8.0

# Post-hoc calibration slopes. Projection spread is systematically too wide;
# shrink toward the positional mean.
#
# These are FALLBACK priors, used only when there is not enough history to
# measure. `fit_from_history` below is the real path — and it matters, because
# these priors turned out to have RB and WR the wrong way round for this league.
#
# Source: Fantasy Football Analytics, 2026. Measured on 2021-2025 preseason ECR
# against realized points under this league's scoring, RB fits 0.85 and WR 0.77
# — an exact swap of the two priors. Shrinking RB harder than WR flattens the
# RB top end while preserving the WR top end, which is how the simulated drafter
# ended up with eight receivers and two running backs.
calibration:
  slopes:
    QB: 0.67
    RB: 0.79
    WR: 0.85
    TE: 0.72
    K: 0.60
    DEF: 0.60

  # Fit the slopes from this league's own history instead of the priors above.
  # Each fold fits on seasons strictly before its target, so this stays
  # leakage-free; preseason ECR starts in 2021, which bounds what is available.
  fit_from_history:
    enabled: true
    # Only the players you would actually draft. Across the whole pool the
    # slopes diverge by position, but that is the deep tail talking — pools
    # differ in depth and the measurement becomes "starters outscore backups".
    # Inside the top 40 all four skill positions fit ~0.70 and the differences
    # between them are noise.
    top_n: 40
    # Below this many (projection, actual) pairs for a position, keep the prior.
    min_obs: 40

  # A second, measured shrink for positions whose rank ordering does not persist
  # year to year. The rank curve is fit on finish rank, which assumes the
  # projection is as good as hindsight; that assumption costs the most exactly
  # where the consensus is weakest. Measured on 2020-2025 (Spearman, prior-year
  # rank vs next-year points, top 48): QB 0.62, TE 0.54, RB 0.46, WR 0.45,
  # K 0.34, DEF 0.26.
  #
  # Scoped to K and DEF on purpose. For the skill positions this measurement
  # uses last year's rank as the stand-in projection, which is strictly worse
  # than the expert consensus, so the number understates them. For K and DEF it
  # matches what everyone already knows about streaming, and without it a
  # defense lands around pick 32 on a value-based board.
  #
  # Set `positions: []` to disable. Recheck once the backtest can score it.
  persistence_shrink:
    positions: [K, DEF]
    reference: QB

# Pricing a position at what the room actually pays for it.
#
# VORP says the best defense out-scores the waiver defense by ~12 points over a
# season. True — and it still concludes you should spend a sixth-round pick to
# get him, which is wrong. The market prices two things VORP does not model:
# those points are unpredictable in advance, and the position is streamable all
# year, so the *pick* buys far less than the *points* imply.
#
# Weight 1.0 prices a position exactly where the market drafts it. 0.0 is pure
# VORP. In between, an unusually good player at that position can still climb
# above his ADP — the blend compresses how far the group floats without
# flattening the ordering inside it.
#
#   DEF 1.0 — no defense is worth reaching for, and the ordering among them is
#             mostly noise anyway (measured persistence 0.26). Sits at ADP.
#   K   0.7 — mostly market, but a genuinely exceptional leg can surface. An
#             ordinary kicker settles back toward where he is actually taken.
#
# `vorp_unanchored` is preserved on the board so you can always see what pure
# VORP thought before the market got a vote.
# QB and TE are anchored for a different reason than K and DEF: not because they
# are streamable, but because the board's cross-position pricing of them is
# measurably worse than the market's. Realized value above replacement, by board
# rank bucket over 2022-2025:
#
#             QB     RB     WR     TE
#    1-24    +19    +62    +55    +57
#   25-48    -12    +45     +2     -5
#   49-72    -71     +9    -24     -5
#
# The same table by ADP rank is roughly level (1-24: QB +64, RB +59, WR +53,
# TE +93). The board puts ~4.75 QB per season in its top 24 and they return a
# third of what everything else there returns; the market puts one in and it
# returns +64. Note this survives ECR-only, so it is not the blend.
#
# These two weights are a reasoned starting point, NOT a fitted result -- four
# folds is nowhere near enough to tune them on. They move QB and TE most of the
# way toward market placement while leaving our ordering inside each position.
market_anchor:
  positions:
    DEF: 1.0
    K: 0.7
    # QB: 0.6 and TE: 0.5 were TRIED TWICE AND REJECTED TWICE. Under the old
    # scorer they cost 0.13 places; that test was unfair, because the scorer
    # punished deferring QB for an artifact. Re-run under the corrected
    # waiver-aware scorer they still cost 0.14 (4.78 vs 4.64) and lost win rate
    # (0.531 vs 0.548). Two independent tests, same direction. They also did
    # nothing for the 2025 fold, which was the reason for the re-test: 7.42
    # against 7.45. The QB overdraft is real but it is not what ails 2025. The realized-VOR analysis
    # above is real, but the conclusion drawn from it was wrong: anchoring these
    # two cost 0.84 places in the standings (4.90 -> 5.74) and every other
    # metric with it. Pushing QB toward market placement made the drafter defer
    # the position until it was picked over, and with a cap of one QB there is
    # no second chance. QB has low leverage in a 1-QB league *everywhere* on the
    # board -- the VOR table shows it negative at ranks 25-72 as well as weak at
    # 1-24 -- so the answer is not "later", it is "at market, once".
  # The pick-value curve is fit only on positions whose VORP we trust. Including
  # an anchored position in its own reference curve would be circular.
  reference_positions: [QB, RB, WR, TE]

# How many of each position is worth owning. These are the manager's actual
# strategy, not a model output: one quarterback, one tight end (a second only
# when he beats the other flex options, which the drop-off policy works out on
# its own -- the cap just permits it), one kicker, one defense.
#
# The cap is a ceiling, not a target. RB and WR are deliberately absent: bench
# depth at those positions is real, because of the flex and because of injury
# attrition.
# In-season waiver policy. The league uses ROLLING PRIORITY, not FAAB, so a
# successful claim costs your place in the queue and there is no such thing as a
# small bid. The threshold is therefore a high bar, not a positive one: a claim
# has to buy a starter, because the alternative is keeping the ability to claim
# the next league-winner.
#
# Expressed in projected points added to this week's starting lineup, after
# accounting for whoever gets dropped. Free-agent adds (a streaming kicker, a
# bye-week fill) cost no priority and are never held to this bar.
waivers:
  priority_threshold: 4.0

draft_policy:
  position_caps:
    QB: 1
    TE: 2
    K: 1
    DEF: 1

  # How far ahead the drop-off policy looks when it asks "who survives to my
  # next turn". Read by BOTH `src/draft/monitor.py` and `scripts/run_backtest.py`
  # so the live board and the backtest cannot drift apart — the same invariant
  # `src/features/pipeline.py` enforces for the valuation.
  #
  #   next_pick     our literal next turn.
  #   next_exposed  the next turn opponents have actually picked before.
  #
  # They differ ONLY at a turn slot (1 and 10), and we draft from 10. A snake
  # gives slot 10 back-to-back picks, so at picks 10, 30, 50 ... 150 the literal
  # answer is 0 — nobody drafts in between. That correct 0 is poison for the
  # policy: `ValueDrafter.survivors()` returns the pool unfiltered at <= 0, so
  # every position's best-now and best-later are the same player, every
  # candidate's drop-off is exactly 0.0, and the ranking falls through to its
  # raw-VORP tiebreak. Raw VORP is the policy `ValueDrafter` was written to
  # replace. It runs on half our picks.
  #
  # MEASURED, paired on the same board/seed/opponents, slot 10 pinned, 160
  # drafts (`python -m scripts.compare_lookahead --my-slot 10 --drafts 40`):
  #
  #   metric               next_pick   next_exposed     diff       t
  #   playoff pts             389.96         393.25    +3.28    1.32
  #   season pts             2298.60        2297.99    -0.61   -0.07
  #   win rate                  0.55           0.55    -0.01   -0.42
  #   league rank               4.69           4.54    -0.15   -0.85
  #
  # Nothing reaches significance, and the only two folds that do point OPPOSITE
  # ways and cancel: 2022 -1.27 (t=-2.74, better), 2024 +0.70 (t=+2.58, worse).
  # That is the four-fold noise floor CLAUDE.md names, not a result.
  #
  # So this ships as `next_pick`: it is what every recorded number and
  # `tests/fixtures/backtest_baseline.json` were measured under, and the
  # measurement gives no reason to pay the cost of moving off it. The argument
  # for `next_exposed` is correctness, not points — see HANDOFF.md. Flipping it
  # is a PICK-POLICY change: it moves live recommendations AND invalidates the
  # parity baseline (the fixture randomizes slots, 2 of 10 are turn slots), so
  # it requires `python -m scripts.check_backtest_baseline` and a deliberate
  # re-record. One line here, but not a free one.
  lookahead_rule: next_pick

# Consensus blend. Each component is z-scored within position, averaged, then
# mapped back to points.
#
# Weights are equal *across peer sources* — source accuracy does not persist
# year to year, so averaging is the robust choice and fitting these on six
# seasons would be overfitting with extra steps.
#
# ECR is not a peer source, which is why it carries more weight. It already
# contains both production components plus everything they structurally cannot:
# depth charts, camp reports, holdouts, trades, and rookies with no NFL snaps.
# The two production components are also not independent of each other — they
# are last season measured twice, once with touchdown luck and once without —
# so they split a single unit of weight rather than taking one each.
#
# This is the board's main tuning knob. Raising the production weights makes the
# board disagree with the draft room more often; that is where the points are,
# and also where the blowups are.
blend:
  components:
    ecr_points: 2.0    # FantasyPros expert consensus rank -> points via rank curve
    xfp_points: 0.5    # prior-season expected fantasy points, per-game, shrunk
    prior_points: 0.5  # prior-season actual fantasy points, per-game, shrunk
  method: zscore_mean_within_position

  # FantasyPros no longer server-renders more than the top 10 rows of its
  # projections tables, so point projections are not scrapable. ECR (via
  # ffverse, which redistributes it) is the consensus signal we actually get,
  # and `src/features/rank_curve.py` converts it to points.

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs
